<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #F4F6FC;
            --surface: #FFFFFF;
            --surface2: #F8FAFC;
            --border: #E8EEF5;
            --accent: #6C5CE7;
            --accent2: #FF7675;
            --text: #2D3436;
            --muted: #8E9EAD;
            
            /* Custom Pastel Accents */
            --accent-purple-light: #EFE9FF;
            --accent-blue-light: #EBF3FF;
            --accent-orange-light: #FFF2E8;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background decoration */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(108,92,231,0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -15%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,118,117,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 3rem 2.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(142, 158, 173, 0.12);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .header { margin-bottom: 2rem; }

        .tag {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.08em;
            margin-bottom: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent-purple-light);
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            border: 1px solid rgba(108, 92, 231, 0.15);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .form-group { margin-bottom: 1.2rem; }

        label {
            display: block;
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.85rem 1.1rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--accent);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
        }

        input::placeholder { color: var(--muted); }

        /* Strength Indicator */
        .strength-bars {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .bar {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            transition: background 0.3s;
        }

        .bar.weak   { background: #FF7675; }
        .bar.medium { background: #FFEAA7; }
        .bar.strong { background: #55EFC4; }

        .strength-text {
            font-family: 'Outfit', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn {
            width: 100%;
            margin-top: 1.6rem;
            padding: 0.95rem;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 100%);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35);
        }

        .btn:active { transform: translateY(0); }

        .footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #5F2EEA;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="tag">AUTH / REGISTRO</div>
        <h1>Crear cuenta</h1>
    </div>

    <form action="/registro" method="post">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="username" placeholder="Ingresa tu usuario" required autocomplete="username">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="pwd" name="password" placeholder="••••••••" required autocomplete="new-password" oninput="checkStrength(this.value)">
            <div class="strength-bars">
                <div class="bar" id="b1"></div>
                <div class="bar" id="b2"></div>
                <div class="bar" id="b3"></div>
            </div>
            <div class="strength-text" id="slabel"></div>
        </div>
        <div class="form-group">
            <label>Confirmar contraseña</label>
            <input type="password" name="confirm" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn">Registrarse</button>
    </form>

    <div class="footer">
        ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
    </div>
</div>

<script>
    function checkStrength(v) {
      const bars = ['b1','b2','b3'].map(id => document.getElementById(id));
      const label = document.getElementById('slabel');
      bars.forEach(b => b.className = 'bar');
      if (!v) { label.textContent = ''; return; }
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v) || /\d/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v) && v.length >= 10) score++;
      const cls = ['weak','medium','strong'];
      const txt = ['débil','moderada','fuerte'];
      for (let i = 0; i < score; i++) bars[i].classList.add(cls[score-1]);
      label.textContent = score ? txt[score-1] : '';
    }
</script>
</body>
</html>
